services:
  - type: web
    name: examguard-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && cd server && npx prisma generate && cd .. && npm run build -w @examguard/server
    startCommand: cd server && npx prisma migrate deploy && cd .. && npm run start -w @examguard/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
